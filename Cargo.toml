[package]
name = "musay"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Modular Discord music bot core in Rust"
license = "MIT"

[features]
default = ["discord"]
discord = ["dep:serenity", "dep:songbird", "dep:reqwest"]

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }

# The default executable includes the production Discord/voice adapter; `--self-check` remains credential-free.
serenity = { version = "0.12.5", optional = true, default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "framework", "standard_framework"] }
songbird = { version = "0.6.0", optional = true, default-features = false, features = ["driver", "gateway", "serenity", "rustls", "tungstenite"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

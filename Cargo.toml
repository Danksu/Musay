[package]
name = "musay"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Modular Discord music bot core in Rust"
license = "MIT"

[features]
default = []
discord = ["dep:serenity", "dep:songbird"]

[dependencies]
async-trait = "0.1"
dotenvy = "0.15"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

# Optional production Discord adapter. The default build remains testable without credentials.
serenity = { version = "0.12.5", optional = true, default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache", "framework", "standard_framework"] }
songbird = { version = "0.6.0", optional = true, default-features = false, features = ["serenity", "rustls"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
